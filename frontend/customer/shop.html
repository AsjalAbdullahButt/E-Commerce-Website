<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop All Products | E-COM</title>
  <link rel="icon" type="image/png" href="../images/E_Commerce_Logo.png?v=20260511">
  <meta name="description" content="Browse the full E-COM catalog — filter by category, price, and availability. Fast delivery across Pakistan.">
  <meta name="robots" content="index, follow">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="E-COM">
  <meta property="og:title" content="Shop All Products | E-COM">
  <meta property="og:description" content="Browse the full E-COM catalog — filter by category, price, and availability. Fast delivery across Pakistan.">
  <meta name="twitter:card" content="summary">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../shared/css/global.css?v=20260719">
  <link rel="stylesheet" href="../shared/css/tailwind.build.css?v=20260719">
  <link rel="stylesheet" href="../shared/css/shop.css?v=20260716">
  <script src="../shared/js/components/site-header.js?v=20260719"></script>
  <script src="../shared/js/components/site-footer.js?v=20260719"></script>
</head>
<body>

  <canvas id="neural-bg"></canvas>

  <site-header variant="shop" links='[{"href":"./index.html","label":"Home","active":false},{"href":"./shop.html","label":"Shop","active":true},{"href":"./about.html","label":"About","active":false},{"href":"./contact.html","label":"Contact","active":false}]'></site-header>
<div class="cart-overlay" id="cart-overlay"></div>
  <aside class="cart-drawer" id="cart-drawer" role="dialog" aria-modal="true" aria-label="Shopping cart" aria-hidden="true"></aside>

  <main>
    <div class="shop-header">
      <h1 class="shop-title">Shop Our Collection</h1>
    </div>

    <div class="filters-bar reveal">
      <div class="filter-group">
        <label for="shop-search">Search</label>
        <input type="text" id="shop-search" placeholder="Search products..." data-search>
      </div>
      <div class="filter-group">
        <label for="shop-category">Category</label>
        <select id="shop-category" data-category>
          <option value="">All Categories</option>
          <option value="t-shirts">T-Shirts</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="shop-sort">Sort By</label>
        <select id="shop-sort" data-sort>
          <option value="newest">Newest</option>
          <option value="price_asc">Price: Low to High</option>
          <option value="price_desc">Price: High to Low</option>
          <option value="rating">Top Rated</option>
        </select>
      </div>
    </div>

    <div class="product-grid reveal-stagger"></div>

    <div class="load-more">
      <button>Load More</button>
    </div>
  </main>

  <site-footer variant="full"></site-footer>
<script src="../shared/js/config.js?v=20260716"></script>
  <script src="../shared/js/api.js?v=20260716"></script>
  <script src="../shared/js/auth.js?v=20260716"></script>
  <script src="../shared/js/cart.js?v=20260716"></script>
  <script src="../shared/js/sanitize.js?v=20260716"></script>
  <script src="../shared/js/ui-states.js?v=20260719"></script>
  <script src="../js/shop.js?v=20260716"></script>
  <script src="../shared/js/neural-bg.js?v=20260716"></script>
  <script src="../shared/js/product-tilt.js?v=20260716"></script>
  <script src="../shared/js/scroll-reveal.js?v=20260716"></script>

  <!-- WhatsApp Support Button — TODO: replace number with real WhatsApp Business number -->
  <a href="https://wa.me/923001234567?text=Hi%2C%20I%20need%20help%20with%20my%20E-COM%20order"
     class="whatsapp-float"
     target="_blank"
     rel="noopener noreferrer"
     aria-label="Chat with us on WhatsApp"
     title="WhatsApp Support">
    <i class="fab fa-whatsapp"></i>
  </a>
</body>
</html>
