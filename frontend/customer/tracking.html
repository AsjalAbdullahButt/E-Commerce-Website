<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Order | E-COM</title>
  <script>
    (function () {
      // Pre-render guard only, to avoid a flash of protected content — the access token itself
      // lives in memory only (see shared/js/api.js) and isn't available this early, so this
      // checks the non-sensitive cached profile instead. Actual auth is enforced server-side on
      // every API call regardless. A guest order's tracking link carries ?guest_email=... instead
      // of a session — see js/checkout.js and js/tracking.js.
      const user = localStorage.getItem('ecom_user');
      const role = localStorage.getItem('ecom_role');
      const isGuestLink = new URLSearchParams(window.location.search).has('guest_email');
      if ((!user || role !== 'customer') && !isGuestLink) {
        window.location.replace('../auth/login.html');
      }
    })();
  </script>
