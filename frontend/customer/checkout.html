<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | E-COM</title>
  <link rel="icon" type="image/png" href="../images/E_Commerce_Logo.png?v=20260511">
  <meta name="robots" content="noindex, nofollow">
  <!-- No login guard — guest checkout is allowed (see js/checkout.js). A logged-in customer's
       shipping details are still prefilled by initializeCheckout() when a session exists. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../shared/css/global.css?v=20260719">
  <link rel="stylesheet" href="../shared/css/tailwind.build.css?v=20260719">
  <link rel="stylesheet" href="../shared/css/checkout.css?v=20260716">
  <script src="../shared/js/components/site-header.js?v=20260719"></script>
  <script src="../shared/js/components/site-footer.js?v=20260719"></script>
</head>
<body>

  <canvas id="neural-bg"></canvas>

  <site-header variant="shop" links='[{"href":"./index.html","label":"Home","active":false},{"href":"./shop.html","label":"Shop","active":false},{"href":"./about.html","label":"About","active":false},{"href":"./contact.html","label":"Contact","active":false}]'></site-header>
<div class="cart-overlay" id="cart-overlay"></div>
  <aside class="cart-drawer" id="cart-drawer" role="dialog" aria-modal="true" aria-label="Shopping cart" aria-hidden="true"></aside>

  <main>
    <h1 class="checkout-title">Checkout</h1>

    <div class="checkout-progress" id="checkout-progress">
      <div class="progress-step" data-step="shipping">
        <span class="progress-dot"><i class="fas fa-truck"></i><i class="fas fa-check progress-check"></i></span>
        <span class="progress-label">Shipping</span>
      </div>
      <div class="progress-line"><span class="progress-line-fill"></span></div>
      <div class="progress-step" data-step="payment">
        <span class="progress-dot"><i class="fas fa-credit-card"></i><i class="fas fa-check progress-check"></i></span>
        <span class="progress-label">Payment</span>
      </div>
      <div class="progress-line"><span class="progress-line-fill"></span></div>
      <div class="progress-step" data-step="review">
        <span class="progress-dot"><i class="fas fa-box"></i><i class="fas fa-check progress-check"></i></span>
        <span class="progress-label">Place Order</span>
      </div>
    </div>

    <div class="checkout-container">
      <div class="order-summary reveal"></div>

      <form class="checkout-form">
        <div class="form-section" id="checkout-section-shipping">
          <h3 class="form-section-title">Shipping Address</h3>
          <!-- Shown only for guests (no session) — initializeCheckout() in js/checkout.js hides
               this when the shopper is logged in, since their account email is used instead. -->
          <div class="form-grid full" id="guest-email-group">
            <div class="form-group">
              <label for="checkout-guestEmail">Email <small>(for your order confirmation &amp; receipt)</small></label>
              <input type="email" id="checkout-guestEmail" name="guestEmail" autocomplete="email" placeholder="you@example.com">
            </div>
          </div>
          <!-- Logged-in shoppers with saved addresses (frontend/customer/profile.html) get a
               picker here instead of retyping — initPaymentMethods()'s sibling, initAddressPicker()
               in js/checkout.js, fills it in and hides itself if there's nothing saved yet. -->
          <div class="form-grid full" id="saved-address-picker" style="display:none;"></div>
          <div class="form-grid">
            <div class="form-group">
              <label for="checkout-fullName">Full Name</label>
              <input type="text" id="checkout-fullName" name="fullName" required autocomplete="name">
            </div>
            <div class="form-group">
              <label for="checkout-phone">Phone</label>
              <input type="tel" id="checkout-phone" name="phone" required autocomplete="tel">
            </div>
          </div>
          <div class="form-grid full">
            <div class="form-group">
              <label for="checkout-address">Address</label>
              <input type="text" id="checkout-address" name="address" required autocomplete="street-address">
            </div>
          </div>
          <div class="form-grid">
            <div class="form-group">
              <label for="checkout-city">City</label>
              <input type="text" id="checkout-city" name="city" required autocomplete="address-level2">
            </div>
            <div class="form-group">
              <label for="checkout-postal">Postal Code</label>
              <input type="text" id="checkout-postal" name="postal" required autocomplete="postal-code">
            </div>
          </div>
        </div>

        <div class="form-section">
          <h3 class="form-section-title">Promo Code (Optional)</h3>
          <div class="promo-section">
            <label for="checkout-promo" class="sr-only">Promo code</label>
            <input type="text" id="checkout-promo" placeholder="Enter promo code" name="promo">
            <button type="button">Apply</button>
          </div>
        </div>

        <div class="form-section" id="checkout-section-payment">
          <h3 class="section-label">Payment Method</h3>
          <div class="payment-options" id="payment-options">

            <label class="payment-option active" data-method="cod">
              <input type="radio" name="payment_method" value="cod" checked>
              <span class="pay-icon"><i class="fas fa-money-bill-wave"></i></span>
              <span class="pay-info">
                <strong>Cash on Delivery</strong>
                <small>Pay when your order arrives</small>
              </span>
              <span class="pay-check"><i class="fas fa-check-circle"></i></span>
            </label>

            <label class="payment-option" data-method="jazzcash">
              <input type="radio" name="payment_method" value="jazzcash">
              <span class="pay-icon pay-icon--jazzcash"><i class="fas fa-mobile-alt"></i></span>
              <span class="pay-info">
                <strong>JazzCash</strong>
                <small>Mobile wallet payment</small>
              </span>
              <span class="pay-check"><i class="fas fa-check-circle"></i></span>
            </label>

            <label class="payment-option" data-method="easypaisa">
              <input type="radio" name="payment_method" value="easypaisa">
              <span class="pay-icon pay-icon--easypaisa"><i class="fas fa-wallet"></i></span>
              <span class="pay-info">
                <strong>Easypaisa</strong>
                <small>Mobile wallet payment</small>
              </span>
              <span class="pay-check"><i class="fas fa-check-circle"></i></span>
            </label>

            <label class="payment-option" data-method="card">
              <input type="radio" name="payment_method" value="card">
              <span class="pay-icon pay-icon--card"><i class="fas fa-credit-card"></i></span>
              <span class="pay-info">
                <strong>Credit / Debit Card</strong>
                <small>Powered by Stripe</small>
              </span>
              <span class="pay-check"><i class="fas fa-check-circle"></i></span>
            </label>

          </div>

          <!-- JazzCash / Easypaisa / card options that aren't configured server-side are hidden
               at runtime by initPaymentMethods() (checkout.js) — GET /payments/methods is the
               source of truth for which gateways actually work. -->

          <!-- Stripe card details (hidden by default) -->
          <div class="mobile-wallet-fields" id="card-fields" style="display:none;">
            <div class="form-group">
              <label for="card-element">Card Details</label>
              <div id="card-element" class="stripe-card-element"></div>
              <div id="card-errors" class="field-error" role="alert"></div>
            </div>
          </div>

          <!-- JazzCash details (hidden by default) -->
          <div class="mobile-wallet-fields" id="jazzcash-fields" style="display:none;">
            <p class="wallet-instruction">
              <i class="fas fa-info-circle"></i>
              Send payment to: <strong>0300-1234567</strong> (JazzCash) <!-- TODO: replace with real number -->
            </p>
            <div class="form-group">
              <label for="jazzcash-number">Your JazzCash Number</label>
              <input type="tel" id="jazzcash-number" class="form-input"
                     placeholder="03XX-XXXXXXX" maxlength="11">
              <small>Enter the number you sent payment from</small>
            </div>
          </div>

          <!-- Easypaisa details (hidden by default) -->
          <div class="mobile-wallet-fields" id="easypaisa-fields" style="display:none;">
            <p class="wallet-instruction">
              <i class="fas fa-info-circle"></i>
              Send payment to: <strong>0300-1234567</strong> (Easypaisa) <!-- TODO: replace with real number -->
            </p>
            <div class="form-group">
              <label for="easypaisa-number">Your Easypaisa Number</label>
              <input type="tel" id="easypaisa-number" class="form-input"
                     placeholder="03XX-XXXXXXX" maxlength="11">
              <small>Enter the number you sent payment from</small>
            </div>
          </div>
        </div>

        <div id="checkout-section-review">
          <button type="button" class="checkout-btn magnetic-btn" id="place-order-btn">
            <span class="checkout-btn-label">Place Order</span>
            <i class="fas fa-check checkout-btn-check"></i>
          </button>
        </div>
      </form>
    </div>
  </main>

  <site-footer variant="full"></site-footer>
<script src="../shared/js/config.js?v=20260716"></script>
  <script src="../shared/js/api.js?v=20260716"></script>
  <script src="../shared/js/auth.js?v=20260716"></script>
  <script src="../shared/js/cart.js?v=20260716"></script>
  <script src="../shared/js/sanitize.js?v=20260716"></script>
  <script src="../js/checkout.js?v=20260716"></script>
  <script src="../shared/js/neural-bg.js?v=20260716"></script>
  <script src="../shared/js/product-tilt.js?v=20260716"></script>
  <script src="../shared/js/scroll-reveal.js?v=20260716"></script>

  <!-- WhatsApp Support Button — TODO: replace number with real WhatsApp Business number -->
  <a href="https://wa.me/923001234567?text=Hi%2C%20I%20need%20help%20with%20my%20E-COM%20order"
     class="whatsapp-float"
     target="_blank"
     rel="noopener noreferrer"
     aria-label="Chat with us on WhatsApp"
     title="WhatsApp Support">
    <i class="fab fa-whatsapp"></i>
  </a>
</body>
</html>
