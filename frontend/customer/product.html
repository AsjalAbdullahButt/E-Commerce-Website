<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product | E-COM</title>
  <link rel="icon" type="image/png" href="../images/E_Commerce_Logo.png?v=20260511">
  <meta name="description" id="seo-description" content="Shop quality products at E-COM with fast delivery across Pakistan.">
  <meta name="robots" content="index, follow">
  <meta property="og:type" content="product">
  <meta property="og:site_name" content="E-COM">
  <meta property="og:title" id="seo-og-title" content="Product | E-COM">
  <meta property="og:description" id="seo-og-description" content="Shop quality products at E-COM with fast delivery across Pakistan.">
  <meta property="og:image" id="seo-og-image" content="../images/E_Commerce_Logo.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../shared/css/global.css?v=20260719">
  <link rel="stylesheet" href="../shared/css/tailwind.build.css?v=20260719">
  <link rel="stylesheet" href="../shared/css/product.css?v=20260716">
  <script src="../shared/js/components/site-header.js?v=20260719"></script>
  <script src="../shared/js/components/site-footer.js?v=20260719"></script>
</head>
<body>

  <canvas id="neural-bg"></canvas>

  <site-header variant="shop" links='[{"href":"./index.html","label":"Home","active":false},{"href":"./shop.html","label":"Shop","active":false},{"href":"./about.html","label":"About","active":false},{"href":"./contact.html","label":"Contact","active":false}]'></site-header>
<div class="cart-overlay" id="cart-overlay"></div>
  <aside class="cart-drawer" id="cart-drawer" role="dialog" aria-modal="true" aria-label="Shopping cart" aria-hidden="true"></aside>

  <main>
    <div class="product-detail">
      <div class="product-gallery">
        <div class="main-image">
          <img src="./images/fallback.jpg" alt="Product">
        </div>
        <div class="thumbnails"></div>
      </div>

      <div class="product-details">
        <h1 class="product-name">Loading...</h1>
        <p class="product-price">Rs 0</p>
        <p class="product-description">Loading...</p>

        <div class="size-select">
          <label class="size-label">Size</label>
          <div class="size-options"></div>
        </div>

        <div class="color-select">
          <label class="color-label">Color</label>
          <div class="color-options"></div>
        </div>

        <p class="stock-indicator"></p>

        <div class="quantity-control">
          <label class="quantity-label">Quantity</label>
          <div class="quantity-input">
            <button>−</button>
            <span>1</span>
            <button>+</button>
          </div>
        </div>

        <button class="add-to-cart-btn magnetic-btn">Add to Cart</button>
      </div>
    </div>

    <div class="reviews-section reveal">
      <h2 class="reviews-title">Customer Reviews</h2>
    </div>
  </main>

  <site-footer variant="full"></site-footer>
<script src="../shared/js/config.js?v=20260716"></script>
  <script src="../shared/js/api.js?v=20260716"></script>
  <script src="../shared/js/auth.js?v=20260716"></script>
  <script src="../shared/js/cart.js?v=20260716"></script>
  <script src="../shared/js/sanitize.js?v=20260716"></script>
  <script src="../shared/js/ui-states.js?v=20260719"></script>
  <script src="../js/product.js?v=20260716"></script>
  <script src="../shared/js/neural-bg.js?v=20260716"></script>
  <script src="../shared/js/product-tilt.js?v=20260716"></script>
  <script src="../shared/js/scroll-reveal.js?v=20260716"></script>

  <!-- WhatsApp Support Button — TODO: replace number with real WhatsApp Business number -->
  <a href="https://wa.me/923001234567?text=Hi%2C%20I%20need%20help%20with%20my%20E-COM%20order"
     class="whatsapp-float"
     target="_blank"
     rel="noopener noreferrer"
     aria-label="Chat with us on WhatsApp"
     title="WhatsApp Support">
    <i class="fab fa-whatsapp"></i>
  </a>
</body>
</html>
