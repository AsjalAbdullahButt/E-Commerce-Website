<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | E-COM</title>
  <link rel="icon" type="image/png" href="../images/E_Commerce_Logo.png?v=20260511">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../shared/css/global.css?v=20260719">
  <link rel="stylesheet" href="../shared/css/tailwind.build.css?v=20260719">
  <link rel="stylesheet" href="../shared/css/auth.css?v=20260716">
  <script src="../shared/js/components/site-header.js?v=20260719"></script>
  <script src="../shared/js/components/site-footer.js?v=20260719"></script>
</head>
<body>

  <canvas id="neural-bg"></canvas>

  <site-header variant="minimal" logo-href="../customer/index.html"></site-header>
<main>
    <div class="auth-container">
      <div class="auth-card">
        <h1 class="auth-title">Forgot Password</h1>
        <p class="auth-subtitle">Enter your account email and we'll send you a reset link.</p>

        <form id="forgot-form">
          <div class="form-group form-group--floating">
            <input type="email" id="forgot-email" placeholder=" " required autocomplete="email">
            <label for="forgot-email">Email</label>
          </div>
          <button type="button" class="auth-btn" id="forgot-submit-btn" onclick="handleForgotPassword()">Send Reset Link</button>
        </form>

        <p class="auth-footer">
          <a href="./login.html">Back to login</a>
        </p>
      </div>
    </div>
  </main>

  <site-footer variant="minimal"></site-footer>
<script src="../shared/js/config.js?v=20260716"></script>
  <script src="../shared/js/api.js?v=20260716"></script>
  <script src="../shared/js/auth.js?v=20260716"></script>
  <script src="../shared/js/form-validation.js?v=20260719"></script>
  <script src="../shared/js/neural-bg.js?v=20260716"></script>

  <script>
    attachFieldValidation(document.getElementById('forgot-email'), Validators.email);

    async function handleForgotPassword() {
      const email = document.getElementById('forgot-email').value;
      if (!email) {
        showToast('Please enter your email', 'warning');
        shakeField(document.getElementById('forgot-email'));
        return;
      }

      const btn = document.getElementById('forgot-submit-btn');
      btn.disabled = true;
      btn.textContent = 'Sending...';

      try {
        const result = await api.post('/auth/forgot-password', { email });
        showToast(result.message || 'If an account exists, a reset link has been sent.', 'success');
      } catch (err) {
        showToast(err.message || 'Failed to send reset link', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send Reset Link';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('forgot-form').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          handleForgotPassword();
        }
      });
    });
  </script>
</body>
</html>
