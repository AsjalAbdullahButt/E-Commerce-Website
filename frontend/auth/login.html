<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | E-COM</title>
  <link rel="icon" type="image/png" href="../images/E_Commerce_Logo.png?v=20260511">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../shared/css/global.css?v=20260719">
  <link rel="stylesheet" href="../shared/css/tailwind.build.css?v=20260719">
  <link rel="stylesheet" href="../shared/css/auth.css?v=20260716">
  <script src="../shared/js/components/site-header.js?v=20260719"></script>
  <script src="../shared/js/components/site-footer.js?v=20260719"></script>
</head>
<body>

  <canvas id="neural-bg"></canvas>

  <site-header variant="auth-form" logo-href="../customer/index.html" links='[{"href":"../customer/index.html","label":"Home","active":false},{"href":"../customer/shop.html","label":"Shop","active":false},{"href":"../customer/about.html","label":"About","active":false},{"href":"../customer/contact.html","label":"Contact","active":false}]'></site-header>
<div class="cart-overlay" id="cart-overlay"></div>
  <aside class="cart-drawer" id="cart-drawer" role="dialog" aria-modal="true" aria-label="Shopping cart" aria-hidden="true"></aside>

  <main>
    <div class="auth-container">
      <div class="auth-card">
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Login to your E-COM account</p>

        <!-- ROLE SELECTOR (optional for users who know their role) -->
        <div class="role-selector" id="role-selector" style="display: none; margin-bottom: 1.5rem;">
          <p style="font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 0.5rem;">Login as:</p>
          <div class="role-buttons">
            <button type="button" class="role-btn active" data-role="customer">Customer</button>
            <button type="button" class="role-btn" data-role="admin">Admin</button>
            <button type="button" class="role-btn" data-role="rider">Rider</button>
          </div>
        </div>

        <form id="login-form">
          <div class="form-group form-group--floating">
            <input type="email" id="login-email" placeholder=" " required autocomplete="username">
            <label for="login-email">Email</label>
          </div>
          <div class="form-group form-group--floating">
            <div class="password-input-wrapper">
              <input type="password" id="login-password" placeholder=" " required autocomplete="current-password">
              <button type="button" class="password-toggle-btn" id="login-toggle-pwd" aria-label="Toggle password visibility">
                <i class="fas fa-eye-slash"></i>
              </button>
            </div>
            <label for="login-password">Password</label>
          </div>
          <button type="button" class="auth-btn" onclick="handleLogin()">Login</button>
        </form>

        <p class="auth-footer">
          <a href="./forgot-password.html">Forgot password?</a>
        </p>
        <p class="auth-footer">
          Don't have an account? <a href="./register.html">Register here</a>
        </p>
      </div>
    </div>
  </main>

  <site-footer variant="full" customer-base="../customer" auth-base="."></site-footer>
<script src="../shared/js/config.js?v=20260716"></script>
  <script src="../shared/js/api.js?v=20260716"></script>
  <script src="../shared/js/auth.js?v=20260716"></script>
  <script src="../shared/js/cart.js?v=20260716"></script>
  <script src="../shared/js/form-validation.js?v=20260719"></script>
  <script src="../shared/js/neural-bg.js?v=20260716"></script>

  <script>
    attachFieldValidation(document.getElementById('login-email'), Validators.email);

    // Handle login
    async function handleLogin() {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      if (!email || !password) {
        showToast('Please fill all fields', 'warning');
        if (!email) shakeField(document.getElementById('login-email'));
        if (!password) shakeField(document.getElementById('login-password'));
        return;
      }

      try {
        const user = await login(email, password);
        showToast('Login successful! Redirecting...', 'success');
        
        // Redirect based on user role (returned from backend)
        setTimeout(() => {
          redirectAfterLogin(user.role);
        }, 1000);
      } catch (err) {
        console.error('Login error:', err);
        const errorMsg = err.message || 'Login failed. Please check your credentials and try again.';
        showToast(errorMsg, 'error');
        shakeField(document.getElementById('login-password'));
      }
    }

    // Make form submission work with Enter key
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('login-form');
      form.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          handleLogin();
        }
      });
    });
  </script>

  <!-- WhatsApp Support Button -->
  <a href="https://wa.me/923001234567?text=Hi%2C%20I%20need%20help%20with%20my%20E-COM%20order"
     class="whatsapp-float"
     target="_blank"
     rel="noopener noreferrer"
     aria-label="Chat with us on WhatsApp"
     title="WhatsApp Support">
    <i class="fab fa-whatsapp"></i>
  </a>
</body>
</html>
