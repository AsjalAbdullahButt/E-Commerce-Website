<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | E-COM</title>
  <link rel="icon" type="image/png" href="../images/E_Commerce_Logo.png?v=20260511">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../shared/css/global.css?v=20260719">
  <link rel="stylesheet" href="../shared/css/tailwind.build.css?v=20260719">
  <link rel="stylesheet" href="../shared/css/auth.css?v=20260716">
  <script src="../shared/js/components/site-header.js?v=20260719"></script>
  <script src="../shared/js/components/site-footer.js?v=20260719"></script>
</head>
<body>

  <canvas id="neural-bg"></canvas>

  <site-header variant="minimal" logo-href="../customer/index.html"></site-header>
<main>
    <div class="auth-container">
      <div class="auth-card">
        <h1 class="auth-title">Reset Password</h1>
        <p class="auth-subtitle" id="reset-subtitle">Choose a new password for your account.</p>

        <form id="reset-form">
          <div class="form-group form-group--floating">
            <div class="password-input-wrapper">
              <input type="password" id="reset-password" placeholder=" " required autocomplete="new-password" aria-describedby="reset-password-help">
            </div>
            <label for="reset-password">New Password</label>
            <small class="inline-help" id="reset-password-help">At least 8 characters, one uppercase letter, one digit.</small>
          </div>
          <div class="form-group form-group--floating">
            <div class="password-input-wrapper">
              <input type="password" id="reset-confirm" placeholder=" " required autocomplete="new-password">
            </div>
            <label for="reset-confirm">Confirm New Password</label>
          </div>
          <button type="button" class="auth-btn" id="reset-submit-btn" onclick="handleResetPassword()">Reset Password</button>
        </form>

        <p class="auth-footer">
          <a href="./login.html">Back to login</a>
        </p>
      </div>
    </div>
  </main>

  <site-footer variant="minimal"></site-footer>
<script src="../shared/js/config.js?v=20260716"></script>
  <script src="../shared/js/api.js?v=20260716"></script>
  <script src="../shared/js/auth.js?v=20260716"></script>
  <script src="../shared/js/form-validation.js?v=20260719"></script>
  <script src="../shared/js/neural-bg.js?v=20260716"></script>

  <script>
    attachFieldValidation(document.getElementById('reset-password'), Validators.strongPassword);
    attachFieldValidation(
      document.getElementById('reset-confirm'),
      Validators.matches(() => document.getElementById('reset-password').value, 'Passwords do not match')
    );

    function getResetToken() {
      return new URLSearchParams(window.location.search).get('token');
    }

    async function handleResetPassword() {
      const token = getResetToken();
      if (!token) {
        showToast('Missing or invalid reset link', 'error');
        return;
      }

      const password = document.getElementById('reset-password').value;
      const confirm = document.getElementById('reset-confirm').value;

      if (!password || !confirm) {
        showToast('Please fill both fields', 'warning');
        if (!password) shakeField(document.getElementById('reset-password'));
        if (!confirm) shakeField(document.getElementById('reset-confirm'));
        return;
      }
      if (password !== confirm) {
        showToast('Passwords do not match', 'warning');
        shakeField(document.getElementById('reset-password'));
        shakeField(document.getElementById('reset-confirm'));
        return;
      }

      const btn = document.getElementById('reset-submit-btn');
      btn.disabled = true;
      btn.textContent = 'Resetting...';

      try {
        const result = await api.post('/auth/reset-password', { token, new_password: password });
        showToast(result.message || 'Password reset successfully', 'success');
        setTimeout(() => { window.location.href = './login.html'; }, 1500);
      } catch (err) {
        showToast(err.message || 'Failed to reset password. The link may have expired.', 'error');
        shakeField(document.getElementById('reset-password'));
      } finally {
        btn.disabled = false;
        btn.textContent = 'Reset Password';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (!getResetToken()) {
        document.getElementById('reset-subtitle').textContent = 'This reset link is missing a token. Request a new one from the forgot password page.';
        document.getElementById('reset-submit-btn').disabled = true;
      }
      document.getElementById('reset-form').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          handleResetPassword();
        }
      });
    });
  </script>
</body>
</html>
