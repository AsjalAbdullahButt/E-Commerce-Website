<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | E-COM</title>
  <link rel="icon" type="image/png" href="../images/E_Commerce_Logo.png?v=20260511">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../shared/css/global.css?v=20260719">
  <link rel="stylesheet" href="../shared/css/tailwind.build.css?v=20260719">
  <link rel="stylesheet" href="../shared/css/auth.css?v=20260716">
  <script src="../shared/js/components/site-header.js?v=20260719"></script>
  <script src="../shared/js/components/site-footer.js?v=20260719"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <canvas id="neural-bg"></canvas>

  <site-header variant="auth-form" logo-href="../customer/index.html" links='[{"href":"../customer/index.html","label":"Home","active":false},{"href":"../customer/shop.html","label":"Shop","active":false},{"href":"../customer/about.html","label":"About","active":false},{"href":"../customer/contact.html","label":"Contact","active":false}]'></site-header>
<div class="cart-overlay" id="cart-overlay"></div>
  <aside class="cart-drawer" id="cart-drawer" role="dialog" aria-modal="true" aria-label="Shopping cart" aria-hidden="true"></aside>

  <main>
    <div class="auth-container">
      <div class="auth-card">
        <h1 class="auth-title">Join E-COM</h1>
        <p class="auth-subtitle">Create your account to start shopping</p>

        <form id="register-form">
          <div class="form-group form-group--floating">
            <input type="text" id="register-name" placeholder=" " required autocomplete="name">
            <label for="register-name">Full Name</label>
          </div>
          <div class="form-group form-group--floating">
            <input type="email" id="register-email" placeholder=" " required autocomplete="email">
            <label for="register-email">Email</label>
          </div>
          <div class="form-group form-group--floating">
            <input type="tel" id="register-phone" placeholder=" " autocomplete="tel">
            <label for="register-phone">Phone</label>
          </div>
          <div class="form-group form-group--floating">
            <div class="password-input-wrapper">
              <input type="password" id="register-password" placeholder=" " required autocomplete="new-password">
              <button type="button" class="password-toggle-btn" id="register-toggle-pwd" aria-label="Toggle password visibility">
                <i class="fas fa-eye-slash"></i>
              </button>
            </div>
            <label for="register-password">Password</label>
          </div>
          <div class="form-group form-group--floating">
            <div class="password-input-wrapper">
              <input type="password" id="register-confirm" placeholder=" " required autocomplete="new-password">
              <button type="button" class="password-toggle-btn" id="register-toggle-confirm" aria-label="Toggle password visibility">
                <i class="fas fa-eye-slash"></i>
              </button>
            </div>
            <label for="register-confirm">Confirm Password</label>
          </div>
          <button type="button" class="auth-btn" id="register-submit-btn">Create Account</button>
        </form>

        <div class="auth-divider" id="google-divider">or</div>
        <div class="google-signin-container" id="google-signin-container"></div>

        <p class="auth-footer">
          Already have an account? <a href="./login.html">Login here</a>
        </p>
      </div>
    </div>
  </main>

  <site-footer variant="full" customer-base="../customer" auth-base="."></site-footer>
<script src="../shared/js/config.js?v=20260716"></script>
  <script src="../shared/js/api.js?v=20260716"></script>
  <script src="../shared/js/auth.js?v=20260716"></script>
  <script src="../shared/js/cart.js?v=20260716"></script>
  <script src="../shared/js/form-validation.js?v=20260719"></script>
  <script src="../shared/js/neural-bg.js?v=20260716"></script>

  <script src="js/register.js"></script>

  <!-- WhatsApp Support Button -->
  <a href="https://wa.me/923001234567?text=Hi%2C%20I%20need%20help%20with%20my%20E-COM%20order"
     class="whatsapp-float"
     target="_blank"
     rel="noopener noreferrer"
     aria-label="Chat with us on WhatsApp"
     title="WhatsApp Support">
    <i class="fab fa-whatsapp"></i>
  </a>
</body>
</html>
