<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | E-COM</title>
  <link rel="icon" type="image/png" href="../images/E_Commerce_Logo.png?v=20260511">
  
  <!-- AUTH GUARD — Runs FIRST before page renders, to avoid a flash of protected content.
       Checks the cached (non-sensitive) admin profile set by admin/login.html
       (POST /admin/auth/login), not the customer-facing ecom_* keys. The access token itself
       lives in memory only (see js/admin-api.js) and isn't available this early; real auth is
       enforced server-side on every API call via the httpOnly admin_refresh_token cookie. -->
  <script src="js/admin-guard.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
  <link rel="stylesheet" href="../shared/css/global.css?v=20260719">
  <link rel="stylesheet" href="../shared/css/tailwind.build.css?v=20260719">
  <link rel="stylesheet" href="../shared/css/admin.css?v=20260719">
  <script src="../shared/js/components/site-header.js?v=20260719"></script>
  <script src="../shared/js/components/site-footer.js?v=20260719"></script>
</head>
<body data-page="admin-dashboard">

  <canvas id="neural-bg"></canvas>

  <site-header variant="staff" logo-href="../customer/index.html" links='[{"href":"./dashboard.html","label":"Dashboard","active":true},{"href":"./products.html","label":"Products","active":false},{"href":"./orders.html","label":"Orders","active":false},{"href":"./returns.html","label":"Returns","active":false},{"href":"./riders.html","label":"Riders","active":false},{"href":"./promos.html","label":"Promos","active":false},{"href":"./logs.html","label":"Logs","active":false}]'></site-header>
<main>
    <div class="admin-header">
      <div class="admin-header-copy">
        <h1 class="dashboard-title">Admin Dashboard</h1>
        <p class="dashboard-subtitle">Revenue, order flow, and catalog health at a glance.</p>
      </div>
      <div class="admin-toolbar">
        <button class="builder-button" id="download-report-btn" type="button"><i class="fas fa-file-excel"></i> Download Sales Report</button>
      </div>
    </div>

    <!-- Surfaces what used to only be logged/queryable — low stock and pending returns are
         real "someone should act on this" items, not just numbers on a chart. Populated by
         js/analytics.js::loadNotifications() from the existing low-stock endpoint plus the
         Phase 2 returns queue; hidden entirely when there's nothing to flag. -->
    <div id="admin-notifications" class="admin-notifications" style="display:none;"></div>

    <div class="stats-grid reveal-stagger">
      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-wallet"></i></div>
        <div class="stat-content">
          <p class="stat-label">Total Revenue</p>
          <p class="stat-value" data-stat="revenue">Rs 0</p>
          <p class="stat-trend" data-stat-trend="revenue" hidden></p>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-shopping-cart"></i></div>
        <div class="stat-content">
          <p class="stat-label">Total Orders</p>
          <p class="stat-value" data-stat="orders">0</p>
          <p class="stat-trend" data-stat-trend="orders" hidden></p>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-clock"></i></div>
        <div class="stat-content">
          <p class="stat-label">Pending Orders</p>
          <p class="stat-value" data-stat="pending">0</p>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-box"></i></div>
        <div class="stat-content">
          <p class="stat-label">Total Products</p>
          <p class="stat-value" data-stat="products">0</p>
        </div>
      </div>
    </div>

    <section class="analytics-section">
      <div class="analytics-grid reveal-stagger">
        <article class="analytics-card">
          <div class="section-title-row">
            <h2 class="section-title">Revenue by Status</h2>
          </div>
          <canvas id="revenue-status-chart" aria-label="Revenue by status chart"></canvas>
        </article>
        <article class="analytics-card">
          <div class="section-title-row">
            <h2 class="section-title">Orders by Status</h2>
          </div>
          <canvas id="orders-status-chart" aria-label="Orders by status chart"></canvas>
        </article>
        <article class="analytics-card analytics-card-wide">
          <div class="section-title-row">
            <h2 class="section-title">User Growth</h2>
          </div>
          <canvas id="user-growth-chart" aria-label="User growth chart"></canvas>
        </article>
      </div>
    </section>

    <section class="recent-section reveal">
      <h2 class="section-title">Top Products</h2>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Product</th>
              <th>Sold</th>
              <th>Revenue</th>
            </tr>
          </thead>
          <tbody id="top-products-body"></tbody>
        </table>
      </div>
    </section>

    <section class="recent-section reveal">
      <h2 class="section-title">Recent Orders</h2>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Order</th>
              <th>Status</th>
              <th>Total</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="recent-orders-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <site-footer variant="minimal" text="E-Commerce Admin Panel."></site-footer>
<script src="../shared/js/config.js?v=20260716"></script>
  <script src="../shared/js/api.js?v=20260716"></script>
  <script src="./js/admin-config.js?v=20260716"></script>
  <script src="./js/admin-api.js?v=20260716"></script>
  <script src="./js/admin-common.js?v=20260719"></script>
  <script src="../shared/js/ui-states.js?v=20260719"></script>
  <script src="./js/analytics.js?v=20260716"></script>
  <script src="../shared/js/neural-bg.js?v=20260716"></script>
  <script src="../shared/js/scroll-reveal.js?v=20260716"></script>

  <!-- WhatsApp Support Button — TODO: replace number with real WhatsApp Business number -->
  <a href="https://wa.me/923001234567?text=Hi%2C%20I%20need%20help%20with%20my%20E-COM%20order"
     class="whatsapp-float"
     target="_blank"
     rel="noopener noreferrer"
     aria-label="Chat with us on WhatsApp"
     title="WhatsApp Support">
    <i class="fab fa-whatsapp"></i>
  </a>
</body>
</html>
