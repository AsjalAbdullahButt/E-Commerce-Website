<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promos | E-COM Admin</title>
  <link rel="icon" type="image/png" href="../images/E_Commerce_Logo.png?v=20260511">
  
  <!-- AUTH GUARD — Runs FIRST before page renders, to avoid a flash of protected content. The
       access token itself lives in memory only (see js/admin-api.js) and isn't available this
       early; real auth is enforced server-side on every API call via the httpOnly
       admin_refresh_token cookie. -->
  <script>
    (function() {
      const user = JSON.parse(localStorage.getItem('admin_data') || 'null');
      if (!user) { window.location.replace('./login.html'); return; }
      if (!['admin', 'super_admin'].includes(user.role)) { window.location.replace('../customer/index.html'); return; }
    })();
  </script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../shared/css/global.css?v=20260719">
  <link rel="stylesheet" href="../shared/css/tailwind.build.css?v=20260719">
  <link rel="stylesheet" href="../shared/css/admin.css?v=20260719">
  <script src="../shared/js/components/site-header.js?v=20260719"></script>
  <script src="../shared/js/components/site-footer.js?v=20260719"></script>
</head>
<body data-page="admin-promos">

  <canvas id="neural-bg"></canvas>

  <site-header variant="staff" logo-href="../customer/index.html" links='[{"href":"./dashboard.html","label":"Dashboard","active":false},{"href":"./products.html","label":"Products","active":false},{"href":"./orders.html","label":"Orders","active":false},{"href":"./returns.html","label":"Returns","active":false},{"href":"./riders.html","label":"Riders","active":false},{"href":"./promos.html","label":"Promos","active":true},{"href":"./logs.html","label":"Logs","active":false}]'></site-header>
<main>
    <div class="admin-header">
      <div class="admin-header-copy">
        <h1 class="dashboard-title">Promo Codes</h1>
        <p class="dashboard-subtitle">Create discount codes, track usage, and retire codes that have run their course.</p>
      </div>
      <div class="admin-toolbar">
        <button class="btn-primary" id="create-promo-btn" type="button">+ Create Promo</button>
      </div>
    </div>

    <div class="admin-grid reveal-stagger" id="promo-summary"></div>

    <section data-section="promos">
      <div class="admin-form-section reveal">
        <div class="section-title-row">
          <div>
            <h2>Promo Filters</h2>
            <p class="admin-section-desc">Search by code or description, or narrow by status.</p>
          </div>
        </div>

        <div class="filters">
          <input class="search-box" id="promo-search" type="search" placeholder="Search code, description, or type">
          <select class="filter-select" id="promo-status-filter">
            <option value="all">All statuses</option>
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
          </select>
        </div>
      </div>

      <div class="table-wrapper reveal">
        <table>
          <thead>
            <tr>
              <th>Code</th>
              <th>Description</th>
              <th>Type</th>
              <th>Discount</th>
              <th>Min Order</th>
              <th>Valid Until</th>
              <th>Usage</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="promo-table-body">
            <tr id="promo-empty-row" hidden>
              <td colspan="9"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <site-footer variant="minimal" text="E-Commerce Admin Panel."></site-footer>
<script src="../shared/js/config.js"></script>
  <script src="../shared/js/api.js"></script>
  <script src="./js/admin-config.js"></script>
  <script src="./js/admin-api.js"></script>
  <script src="../shared/js/ui-states.js"></script>
  <script src="./js/promos.js?v=20260716"></script>
  <script src="../shared/js/neural-bg.js"></script>
  <script src="../shared/js/scroll-reveal.js"></script>

  <!-- WhatsApp Support Button — TODO: replace number with real WhatsApp Business number -->
  <a href="https://wa.me/923001234567?text=Hi%2C%20I%20need%20help%20with%20my%20E-COM%20order"
     class="whatsapp-float"
     target="_blank"
     rel="noopener noreferrer"
     aria-label="Chat with us on WhatsApp"
     title="WhatsApp Support">
    <i class="fab fa-whatsapp"></i>
  </a>
</body>
</html>
