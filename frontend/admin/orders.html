<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders | E-COM Admin</title>
  <link rel="icon" type="image/png" href="../images/E_Commerce_Logo.png?v=20260511">
  
  <!-- AUTH GUARD — Runs FIRST before page renders, to avoid a flash of protected content.
       Checks the cached (non-sensitive) admin profile set by admin/login.html
       (POST /admin/auth/login), not the customer-facing ecom_* keys. The access token itself
       lives in memory only (see js/admin-api.js) and isn't available this early; real auth is
       enforced server-side on every API call via the httpOnly admin_refresh_token cookie. -->
  <script>
    (function() {
      const user = JSON.parse(localStorage.getItem('admin_data') || 'null');
      if (!user) { window.location.replace('./login.html'); return; }
      if (!['admin', 'super_admin', 'manager', 'support'].includes(user.role)) { window.location.replace('../customer/index.html'); return; }
    })();
  </script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../shared/css/global.css?v=20260719">
  <link rel="stylesheet" href="../shared/css/tailwind.build.css?v=20260719">
  <link rel="stylesheet" href="../shared/css/admin.css?v=20260719">
  <script src="../shared/js/components/site-header.js?v=20260719"></script>
  <script src="../shared/js/components/site-footer.js?v=20260719"></script>
</head>
<body data-page="admin-orders">

  <canvas id="neural-bg"></canvas>

  <site-header variant="staff" logo-href="../customer/index.html" links='[{"href":"./dashboard.html","label":"Dashboard","active":false},{"href":"./products.html","label":"Products","active":false},{"href":"./orders.html","label":"Orders","active":true},{"href":"./returns.html","label":"Returns","active":false},{"href":"./riders.html","label":"Riders","active":false},{"href":"./promos.html","label":"Promos","active":false},{"href":"./logs.html","label":"Logs","active":false}]'></site-header>
<main>
    <div class="admin-header">
      <div class="admin-header-copy">
        <h1 class="dashboard-title">Orders</h1>
        <p class="dashboard-subtitle">Track every order, update fulfillment status, and assign riders.</p>
      </div>
      <div class="admin-toolbar">
        <button class="builder-button" id="refresh-orders-btn" type="button"><i class="fas fa-rotate"></i> Refresh</button>
        <button class="builder-button" id="export-orders-btn" type="button"><i class="fas fa-file-export"></i> Export CSV</button>
        <button class="builder-button" id="bulk-status-btn" type="button" title="Upload a CSV with order_id,status,note columns"><i class="fas fa-file-import"></i> Bulk Status Update</button>
        <input type="file" id="bulk-status-file" accept=".csv" style="display:none;">
      </div>
    </div>

    <section data-section="orders">
      <div class="admin-form-section reveal">
        <div class="section-title-row" style="margin-bottom: 1rem;">
          <div>
            <h2>Order Filters</h2>
            <p class="admin-section-desc">Narrow the list by fulfillment status.</p>
          </div>
          <span class="summary-pill" id="orders-visible-count">0 visible</span>
        </div>

        <div class="filters">
          <select id="order-status-filter" class="filter-select">
            <option value="">All statuses</option>
            <option value="pending">Pending</option>
            <option value="confirmed">Confirmed</option>
            <option value="packed">Packed</option>
            <option value="shipped">Shipped</option>
            <option value="delivered">Delivered</option>
            <option value="cancelled">Cancelled</option>
            <option value="returned">Returned</option>
          </select>
        </div>
      </div>

      <div class="table-wrapper order-table reveal">
        <table>
          <thead>
            <tr>
              <th>Order</th>
              <th>Customer</th>
              <th>Items</th>
              <th>Total</th>
              <th>Status</th>
              <th>Rider</th>
              <th>Placed</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="order-table-body">
            <tr id="order-empty-row">
              <td colspan="8" style="text-align:center;color:var(--text-secondary);padding:2rem;">Loading orders...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <site-footer variant="minimal" text="E-Commerce Admin Panel."></site-footer>
<script src="../shared/js/config.js"></script>
  <script src="../shared/js/api.js"></script>
  <script src="./js/admin-config.js"></script>
  <script src="./js/admin-api.js"></script>
  <script src="./js/orders.js"></script>
  <script src="../shared/js/neural-bg.js"></script>
  <script src="../shared/js/scroll-reveal.js"></script>

  <script>
    (function () {
      const saved = localStorage.getItem('ecom_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', saved);
      document.addEventListener('DOMContentLoaded', () => {
        const icon = document.getElementById('theme-icon');
        if (icon) icon.className = saved === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
        document.getElementById('theme-toggle')?.addEventListener('click', () => {
          const html = document.documentElement;
          const next = (html.getAttribute('data-theme') || 'dark') === 'dark' ? 'light' : 'dark';
          html.setAttribute('data-theme', next);
          localStorage.setItem('ecom_theme', next);
          if (icon) icon.className = next === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
        });
      });
    })();
  </script>

  <!-- WhatsApp Support Button — TODO: replace number with real WhatsApp Business number -->
  <a href="https://wa.me/923001234567?text=Hi%2C%20I%20need%20help%20with%20my%20E-COM%20order"
     class="whatsapp-float"
     target="_blank"
     rel="noopener noreferrer"
     aria-label="Chat with us on WhatsApp"
     title="WhatsApp Support">
    <i class="fab fa-whatsapp"></i>
  </a>
</body>
</html>
