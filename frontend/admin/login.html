<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>Admin Login - E-COM</title>
    <link rel="icon" type="image/png" href="../images/E_Commerce_Logo.png?v=20260511">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../shared/css/global.css?v=20260719">
  <link rel="stylesheet" href="../shared/css/tailwind.build.css?v=20260719">
    <link rel="stylesheet" href="../shared/css/auth.css?v=20260716">
</head>
<body>

    <canvas id="neural-bg"></canvas>

    <main>
        <div class="auth-container">
            <div class="auth-card">
                <h1 class="auth-title">E-COM Admin</h1>
                <p class="auth-subtitle">Secure Admin Access</p>

                <div class="error-message" id="errorMessage" role="alert" aria-live="assertive" style="display:none;"></div>

                <form id="loginForm" aria-label="Admin sign in">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" required placeholder="admin@example.com" autocomplete="username">
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required placeholder="••••••••" autocomplete="current-password">
                    </div>

                    <button type="submit" class="auth-btn" id="loginBtn">
                        <span class="loading-spinner" id="spinner" aria-hidden="true"></span>
                        <span id="btnText">Sign In</span>
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script src="../shared/js/neural-bg.js?v=20260716"></script>
    <script src="js/admin-config.js"></script>
    <script src="js/admin-api.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
