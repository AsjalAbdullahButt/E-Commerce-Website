<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rider Dashboard | E-COM</title>
  <link rel="icon" type="image/png" href="../images/E_Commerce_Logo.png?v=20260511">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../shared/css/global.css?v=20260719">
  <link rel="stylesheet" href="../shared/css/tailwind.build.css?v=20260719">
  <link rel="stylesheet" href="../shared/css/rider.css?v=20260719">
  <script src="../shared/js/components/site-header.js?v=20260719"></script>
  <script src="../shared/js/components/site-footer.js?v=20260719"></script>
</head>
<body>

  <canvas id="neural-bg"></canvas>

  <site-header variant="staff" logo-href="./dashboard.html" links='[{"href":"./dashboard.html","label":"Dashboard","active":true},{"href":"./assigned-orders.html","label":"My Orders","active":false}]'></site-header>
<main>
    <div class="dashboard-header">
      <div>
        <h1>Rider Dashboard</h1>
        <p>Welcome, <span id="rider-name">Rider</span></p>
      </div>
      <div class="status-badge status-badge--success">
        <span class="status-dot"></span>
        <span>Available</span>
      </div>
    </div>

    <div class="stats-grid reveal-stagger">
      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-box"></i></div>
        <div>
          <div class="stat-value" id="stat-total">0</div>
          <div class="stat-label">Total Orders</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-truck"></i></div>
        <div>
          <div class="stat-value" id="stat-pending">0</div>
          <div class="stat-label">Pending Delivery</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-circle-check"></i></div>
        <div>
          <div class="stat-value" id="stat-delivered">0</div>
          <div class="stat-label">Delivered</div>
        </div>
      </div>
    </div>

    <div class="empty-state reveal">
      <i class="fas fa-box"></i>
      <p>Navigate to "My Orders" to view your assigned deliveries</p>
    </div>
  </main>

  <site-footer variant="minimal"></site-footer>
<script src="../shared/js/config.js?v=20260716"></script>
  <script src="../shared/js/api.js?v=20260716"></script>
  <script src="../shared/js/auth.js?v=20260716"></script>
  <script src="../shared/js/neural-bg.js?v=20260716"></script>
  <script src="../shared/js/scroll-reveal.js?v=20260716"></script>

  <script src="js/dashboard.js"></script>
</body>
</html>
