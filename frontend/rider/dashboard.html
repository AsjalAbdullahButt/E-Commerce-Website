<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rider Dashboard | E-COM</title>
  <link rel="icon" type="image/png" href="../images/E_Commerce_Logo.png?v=20260511">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../shared/css/global.css?v=20260719">
  <link rel="stylesheet" href="../shared/css/tailwind.build.css?v=20260719">
  <link rel="stylesheet" href="../shared/css/rider.css?v=20260719">
  <script src="../shared/js/components/site-header.js?v=20260719"></script>
  <script src="../shared/js/components/site-footer.js?v=20260719"></script>
</head>
<body>

  <canvas id="neural-bg"></canvas>

  <site-header variant="staff" logo-href="./dashboard.html" links='[{"href":"./dashboard.html","label":"Dashboard","active":true},{"href":"./assigned-orders.html","label":"My Orders","active":false}]'></site-header>
<main>
    <div class="dashboard-header">
      <div>
        <h1>Rider Dashboard</h1>
        <p style="color: var(--text-secondary); margin-top: 0.5rem;">Welcome, <span id="rider-name">Rider</span></p>
      </div>
      <div class="status-badge available">
        <span class="status-dot"></span>
        <span>Available</span>
      </div>
    </div>

    <div class="stats-grid reveal-stagger">
      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-box"></i></div>
        <div>
          <div class="stat-value" id="stat-total">0</div>
          <div class="stat-label">Total Orders</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-truck"></i></div>
        <div>
          <div class="stat-value" id="stat-pending">0</div>
          <div class="stat-label">Pending Delivery</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-circle-check"></i></div>
        <div>
          <div class="stat-value" id="stat-delivered">0</div>
          <div class="stat-label">Delivered</div>
        </div>
      </div>
    </div>

    <div class="empty-state reveal">
      <i class="fas fa-box"></i>
      <p>Navigate to "My Orders" to view your assigned deliveries</p>
    </div>
  </main>

  <site-footer variant="minimal"></site-footer>
<script src="../shared/js/config.js?v=20260716"></script>
  <script src="../shared/js/api.js?v=20260716"></script>
  <script src="../shared/js/auth.js?v=20260716"></script>
  <script src="../shared/js/neural-bg.js?v=20260716"></script>
  <script src="../shared/js/scroll-reveal.js?v=20260716"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = requireRole(['rider']);
      if (user) {
        document.getElementById('rider-name').textContent = user.name || 'Rider';
        loadStats();
      }
      document.getElementById('nav-logout-btn').addEventListener('click', logout);
    });

    function animateStatNumber(id, endValue) {
      const node = document.getElementById(id);
      if (!node) return;
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        node.textContent = String(endValue);
        return;
      }
      const duration = 800;
      const startTime = performance.now();
      const step = (now) => {
        const progress = Math.min(1, (now - startTime) / duration);
        const eased = 1 - Math.pow(1 - progress, 3);
        node.textContent = String(Math.round(endValue * eased));
        if (progress < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }

    async function loadStats() {
      try {
        // /rider/orders only returns orders still in progress (shipped/confirmed/packed) —
        // it never includes delivered orders, so "delivered" must come from /rider/stats instead,
        // which counts across the rider's full order history server-side.
        const [activeOrders, stats] = await Promise.all([
          api.get('/rider/orders', true),
          api.get('/rider/stats', true),
        ]);

        const pending = Array.isArray(activeOrders) ? activeOrders.length : 0;
        const delivered = stats?.delivered || 0;

        animateStatNumber('stat-total', pending + delivered);
        animateStatNumber('stat-pending', pending);
        animateStatNumber('stat-delivered', delivered);
      } catch (err) {
        console.error('Failed to load stats:', err);
      }
    }
  </script>
</body>
</html>
