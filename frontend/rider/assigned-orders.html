<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Deliveries | E-COM</title>
  <link rel="icon" type="image/png" href="../images/E_Commerce_Logo.png?v=20260511">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="../shared/css/global.css?v=20260719">
  <link rel="stylesheet" href="../shared/css/tailwind.build.css?v=20260719">
  <link rel="stylesheet" href="../shared/css/rider.css?v=20260719">
  <script src="../shared/js/components/site-header.js?v=20260719"></script>
  <script src="../shared/js/components/site-footer.js?v=20260719"></script>
</head>
<body>

  <canvas id="neural-bg"></canvas>

  <site-header variant="staff" logo-href="./dashboard.html" links='[{"href":"./dashboard.html","label":"Dashboard","active":false},{"href":"./assigned-orders.html","label":"My Orders","active":true}]'></site-header>
<main>
    <div class="page-header">
      <div>
        <h1>My Deliveries</h1>
        <p>Manage your assigned orders</p>
      </div>
    </div>

    <div class="filter-bar reveal">
      <select id="status-filter">
        <option value="">All Statuses</option>
        <option value="confirmed">Confirmed</option>
        <option value="packed">Packed</option>
        <option value="shipped">Shipped</option>
        <option value="delivered">Delivered</option>
      </select>
      <div class="view-toggle">
        <button id="list-view-btn" class="active"><i class="fas fa-list"></i> List</button>
        <button id="map-view-btn"><i class="fas fa-map-location-dot"></i> Map</button>
      </div>
    </div>

    <div id="map-geocoding-note" class="map-geocoding-note">
      <i class="fas fa-spinner fa-spin"></i> <span id="map-geocoding-text">Locating addresses...</span>
    </div>

    <div id="map-view"></div>

    <!-- Map bottom sheet — populated by openMapSheet() when a marker is tapped -->
    <div class="map-bottom-sheet" id="map-bottom-sheet" hidden></div>

    <div id="orders-container" class="orders-list">
      <div class="card-skeleton" aria-hidden="true"><div class="skeleton skel-bar"></div><div class="skeleton skel-bar"></div><div class="skeleton skel-bar"></div></div>
      <div class="card-skeleton" aria-hidden="true"><div class="skeleton skel-bar"></div><div class="skeleton skel-bar"></div><div class="skeleton skel-bar"></div></div>
    </div>
  </main>

  <site-footer variant="minimal"></site-footer>
<div class="pod-modal-overlay" id="pod-modal-overlay">
    <div class="pod-modal">
      <h3>Proof of Delivery</h3>
      <p>Take or upload a photo of the delivered package before marking this order as delivered.</p>
      <img class="pod-preview" id="pod-preview" alt="Proof of delivery preview">
      <input type="file" id="pod-file-input" accept="image/jpeg,image/png,image/webp" capture="environment">
      <div class="pod-actions">
        <button id="pod-cancel-btn" type="button">Cancel</button>
        <button id="pod-submit-btn" type="button" disabled>Confirm Delivered</button>
      </div>
    </div>
  </div>

  <script src="../shared/js/config.js?v=20260716"></script>
  <script src="../shared/js/api.js?v=20260716"></script>
  <script src="../shared/js/auth.js?v=20260716"></script>
  <script src="../shared/js/sanitize.js?v=20260716"></script>
  <script src="../shared/js/ui-states.js?v=20260719"></script>
  <script src="../shared/js/neural-bg.js?v=20260716"></script>
  <script src="../shared/js/scroll-reveal.js?v=20260716"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script src="js/assigned-orders.js"></script>
</body>
</html>
