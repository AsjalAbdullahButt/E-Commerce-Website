<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Deliveries | E-COM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../shared/css/global.css?v=20260716">
  <style>
    main {
      max-width: 1280px;
      margin: var(--nav-height) auto 0;
      padding: 2rem;
      min-height: calc(100vh - var(--nav-height) - 200px);
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .page-header h1 {
      font-family: var(--font-display);
      font-size: 2rem;
      color: var(--gold);
    }

    .filter-bar {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      padding: 1rem;
      background: var(--bg-card);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
    }

    .filter-bar select {
      padding: 0.6rem 1rem;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 0.9rem;
      cursor: pointer;
    }

    .orders-list {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .order-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      transition: var(--transition);
    }

    .order-card:hover {
      border-color: var(--gold);
      box-shadow: var(--shadow-md);
    }

    .order-card.status-updating {
      border-color: var(--gold);
      animation: card-status-pulse 1.1s ease-in-out infinite;
      pointer-events: none;
      opacity: 0.85;
    }

    @keyframes card-status-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255,215,0,0.35); }
      50%       { box-shadow: 0 0 0 6px rgba(255,215,0,0); }
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .order-id {
      font-family: var(--font-mono);
      color: var(--gold);
      font-weight: 700;
      font-size: 1.1rem;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: var(--gold-glow);
      border: 1px solid var(--gold-border);
      border-radius: var(--radius-pill);
      color: var(--gold);
      font-weight: 600;
      font-size: 0.85rem;
    }

    .status-badge.confirmed,
    .status-badge.packed {
      background: rgba(59,130,246,0.1);
      border-color: rgba(59,130,246,0.3);
      color: #3b82f6;
    }

    .status-badge.shipped {
      background: rgba(245,158,11,0.1);
      border-color: rgba(245,158,11,0.3);
      color: #f59e0b;
    }

    .status-badge.delivered {
      background: rgba(34,197,94,0.1);
      border-color: rgba(34,197,94,0.3);
      color: #22c55e;
    }

    .order-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .detail-group {
      display: flex;
      flex-direction: column;
    }

    .detail-label {
      font-size: 0.8rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }

    .detail-value {
      font-size: 0.95rem;
      color: var(--text-primary);
      font-weight: 500;
    }

    .detail-value strong {
      color: var(--gold);
    }

    .items-list {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1rem;
      margin-bottom: 1.5rem;
      max-height: 200px;
      overflow-y: auto;
    }

    .item {
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }

    .item:last-child {
      border-bottom: none;
    }

    .status-controls {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .btn-status {
      padding: 0.6rem 1.2rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--bg-input);
      color: var(--text-secondary);
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      font-size: 0.9rem;
    }

    .btn-status:hover:not(:disabled) {
      background: var(--gold);
      color: #000;
      border-color: var(--gold);
    }

    .btn-status:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-status.active {
      background: var(--gold);
      color: #000;
      border-color: var(--gold);
    }

    .empty-state {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--text-secondary);
    }

    .empty-state i {
      font-size: 3rem;
      opacity: 0.3;
      margin-bottom: 1rem;
    }

    .loading {
      text-align: center;
      padding: 2rem;
      color: var(--text-secondary);
    }

    /* === STATUS TIMELINE === */
    .status-timeline {
      display: flex;
      align-items: flex-start;
      margin: 0.5rem 0 1.5rem;
    }

    .tl-step {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      position: relative;
      text-align: center;
    }

    .tl-line {
      position: absolute;
      top: 13px;
      left: 50%;
      width: 100%;
      height: 2px;
      background: var(--border);
      z-index: 0;
    }

    .tl-line-fill {
      position: absolute;
      inset: 0;
      width: 0%;
      background: var(--gold);
      transition: width var(--duration-slow) var(--ease);
    }

    .tl-step:last-child .tl-line { display: none; }

    .tl-dot {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--bg-input);
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 0.7rem;
      transition: background var(--duration-base) var(--ease), border-color var(--duration-base) var(--ease), color var(--duration-base) var(--ease);
      position: relative;
      z-index: 1;
    }

    .tl-label {
      font-size: 0.68rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 600;
      transition: color var(--duration-base) var(--ease);
    }

    .tl-time {
      font-size: 0.62rem;
      color: var(--text-muted);
      opacity: 0.8;
    }

    .tl-step.done .tl-dot {
      background: var(--gold);
      border-color: var(--gold);
      color: #000;
    }

    .tl-step.done .tl-label { color: var(--gold); }

    .tl-step.current .tl-dot {
      border-color: var(--gold);
      color: var(--gold);
      animation: tl-pulse 1.6s ease-in-out infinite;
    }

    .tl-step.current .tl-label { color: var(--text-primary); }

    .tl-step.cancelled .tl-dot {
      background: var(--error);
      border-color: var(--error);
      color: #fff;
    }

    .tl-step.cancelled .tl-label { color: var(--error); }

    @keyframes tl-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255,215,0,0.45); }
      50%       { box-shadow: 0 0 0 7px rgba(255,215,0,0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .tl-step.current .tl-dot { animation: none; }
    }

    @media (max-width: 480px) {
      .tl-label { font-size: 0.6rem; }
      .tl-time { display: none; }
    }

    @media (max-width: 1024px) {
      main { padding: 1.5rem; }
    }

    @media (max-width: 768px) {
      .order-details {
        grid-template-columns: 1fr;
      }

      .page-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.75rem;
      }
    }

    @media (max-width: 480px) {
      main { padding: 1rem; }

      .status-controls {
        flex-direction: column;
      }

      .btn-status {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <canvas id="neural-bg"></canvas>

  <nav class="navbar" id="navbar" aria-label="Main navigation">
    <div class="nav-inner">
      <a class="nav-logo" href="./dashboard.html"><span class="logo-e">E</span><span class="logo-dash">-</span><span class="logo-com">COM</span></a>
      <ul class="nav-links" id="nav-links">
        <li><a href="./dashboard.html">Dashboard</a></li>
        <li><a href="./assigned-orders.html" class="active">My Orders</a></li>
      </ul>
      <div class="nav-actions">
        <button class="nav-icon theme-toggle" id="theme-toggle" aria-label="Toggle theme" title="Switch theme">
          <i class="fas fa-moon" id="theme-icon"></i>
        </button>
        <button class="nav-icon" id="nav-logout-btn" aria-label="Logout" style="background:none;border:none;cursor:pointer">
          <i class="fas fa-sign-out-alt"></i>
        </button>
      </div>
    </div>
  </nav>

  <main>
    <div class="page-header">
      <div>
        <h1>My Deliveries</h1>
        <p style="color: var(--text-secondary); margin-top: 0.5rem;">Manage your assigned orders</p>
      </div>
    </div>

    <div class="filter-bar">
      <select id="status-filter" onchange="filterOrders()">
        <option value="">All Statuses</option>
        <option value="confirmed">Confirmed</option>
        <option value="packed">Packed</option>
        <option value="shipped">Shipped</option>
        <option value="delivered">Delivered</option>
      </select>
    </div>

    <div id="orders-container" class="orders-list">
      <div class="loading">
        <i class="fas fa-spinner fa-spin"></i> Loading orders...
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-bottom"><p>&copy; 2025 E-Commerce. All rights reserved.</p></div>
  </footer>

  <script src="../shared/js/config.js?v=20260716"></script>
  <script src="../shared/js/api.js?v=20260716"></script>
  <script src="../shared/js/auth.js?v=20260716"></script>
  <script src="../shared/js/sanitize.js?v=20260716"></script>
  <script src="../shared/js/neural-bg.js?v=20260716"></script>

  <script>
    let allOrders = [];

    document.addEventListener('DOMContentLoaded', () => {
      const user = requireRole(['rider']);
      if (user) {
        loadOrders();
      }
      document.getElementById('nav-logout-btn').addEventListener('click', logout);
    });

    async function loadOrders() {
      try {
        const orders = await api.get('/rider/orders', true);
        allOrders = orders || [];
        renderOrders(allOrders);
      } catch (err) {
        console.error('Failed to load orders:', err);
        showToast('Failed to load orders', 'error');
        const container = document.getElementById('orders-container'); container.textContent = '';
        const empty = document.createElement('div'); empty.className = 'empty-state'; const icon = document.createElement('i'); icon.className = 'fas fa-exclamation-triangle'; const p = document.createElement('p'); p.textContent = 'Failed to load orders'; empty.appendChild(icon); empty.appendChild(p); container.appendChild(empty);
      }
    }

    function filterOrders() {
      const status = document.getElementById('status-filter').value;
      const filtered = status ? allOrders.filter(o => o.status === status) : allOrders;
      renderOrders(filtered);
    }

    // Pipeline the rider cares about. status_history (already returned by GET /rider/orders,
    // per backend/schemas/order.py) supplies the timestamp for each step that's been reached.
    const STATUS_PIPELINE = ['confirmed', 'packed', 'shipped', 'delivered'];

    function buildStatusTimeline(order) {
      const timeline = document.createElement('div'); timeline.className = 'status-timeline';
      const currentIdx = STATUS_PIPELINE.indexOf(order.status);
      const history = Array.isArray(order.status_history) ? order.status_history : [];
      const isTerminalBad = order.status === 'cancelled' || order.status === 'returned';

      STATUS_PIPELINE.forEach((status, idx) => {
        const step = document.createElement('div'); step.className = 'tl-step';
        if (isTerminalBad) {
          step.classList.add(idx === 0 ? 'cancelled' : '');
        } else if (idx < currentIdx) {
          step.classList.add('done');
        } else if (idx === currentIdx) {
          step.classList.add('current');
        }

        const line = document.createElement('div'); line.className = 'tl-line';
        const lineFill = document.createElement('div'); lineFill.className = 'tl-line-fill';
        if (idx < currentIdx) lineFill.style.width = '100%';
        line.appendChild(lineFill);

        const dot = document.createElement('span'); dot.className = 'tl-dot';
        const icon = document.createElement('i');
        icon.className = idx < currentIdx ? 'fas fa-check' : 'fas fa-circle-dot';
        dot.appendChild(icon);

        const label = document.createElement('span'); label.className = 'tl-label'; label.textContent = formatStatus(status);

        const entry = history.find(h => h.status === status);
        step.appendChild(line);
        step.appendChild(dot);
        step.appendChild(label);
        if (entry?.timestamp) {
          const time = document.createElement('span'); time.className = 'tl-time';
          try { time.textContent = new Date(entry.timestamp).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); } catch { /* skip */ }
          step.appendChild(time);
        }
        timeline.appendChild(step);
      });

      return timeline;
    }

    function renderOrders(orders) {
      const container = document.getElementById('orders-container');
      container.textContent = '';

      if (!orders || orders.length === 0) {
        const empty = document.createElement('div'); empty.className = 'empty-state';
        const icon = document.createElement('i'); icon.className = 'fas fa-box';
        const p = document.createElement('p'); p.textContent = 'No orders to display';
        empty.appendChild(icon); empty.appendChild(p);
        container.appendChild(empty);
        return;
      }

      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      orders.forEach((order, idx) => {
        const card = document.createElement('div'); card.className = 'order-card'; card.dataset.orderId = order.id;

        const header = document.createElement('div'); header.className = 'order-header';
        const left = document.createElement('div');
        const idDiv = document.createElement('div'); idDiv.className = 'order-id'; idDiv.textContent = `Order #${(order.id && order.id.substring) ? order.id.substring(0,8) : 'N/A'}`;
        const dateP = document.createElement('p'); dateP.style.color = 'var(--text-secondary)'; dateP.style.fontSize = '0.85rem'; dateP.style.marginTop = '0.25rem'; dateP.textContent = new Date(order.created_at).toLocaleDateString();
        left.appendChild(idDiv); left.appendChild(dateP);

        const statusSpan = document.createElement('span'); statusSpan.className = `status-badge ${order.status || 'confirmed'}`;
        const statusIcon = document.createElement('i'); statusIcon.className = 'fas fa-circle-dot';
        const statusText = document.createTextNode(' ' + formatStatus(order.status));
        statusSpan.appendChild(statusIcon); statusSpan.appendChild(statusText);

        header.appendChild(left); header.appendChild(statusSpan);

        card.appendChild(header);
        card.appendChild(buildStatusTimeline(order));

        const details = document.createElement('div'); details.className = 'order-details';
        const addrGroup = document.createElement('div'); addrGroup.className = 'detail-group';
        const addrLabel = document.createElement('span'); addrLabel.className = 'detail-label'; addrLabel.textContent = 'Delivery Address';
        const addr = order.shipping_address;
        const addrValue = document.createElement('span'); addrValue.className = 'detail-value';
        addrValue.textContent = addr ? `${addr.address}, ${addr.city} ${addr.postal_code}` : 'N/A';
        addrGroup.appendChild(addrLabel); addrGroup.appendChild(addrValue);

        const countGroup = document.createElement('div'); countGroup.className = 'detail-group';
        const countLabel = document.createElement('span'); countLabel.className = 'detail-label'; countLabel.textContent = 'Items Count';
        const countValue = document.createElement('span'); countValue.className = 'detail-value'; const strong = document.createElement('strong'); strong.textContent = String(order.items?.length || 0); countValue.appendChild(strong); countValue.appendChild(document.createTextNode(' item(s)'));
        countGroup.appendChild(countLabel); countGroup.appendChild(countValue);

        details.appendChild(addrGroup); details.appendChild(countGroup);

        const itemsList = document.createElement('div'); itemsList.className = 'items-list';
        const itemsTitle = document.createElement('strong'); itemsTitle.style.display = 'block'; itemsTitle.style.marginBottom = '0.5rem'; itemsTitle.style.color = 'var(--text-secondary)'; itemsTitle.textContent = 'Items:';
        itemsList.appendChild(itemsTitle);
        (order.items || []).forEach(item => {
          const itemDiv = document.createElement('div'); itemDiv.className = 'item';
          itemDiv.textContent = `${item.name} x${item.quantity} - Rs ${item.price}`;
          itemsList.appendChild(itemDiv);
        });

        // Backend only allows a rider to set 'shipped' (from confirmed/packed) or 'delivered'
        // (from shipped) — see backend/utils/order_transitions.py.
        const controls = document.createElement('div'); controls.className = 'status-controls';
        const shipBtn = document.createElement('button');
        shipBtn.className = `btn-status ${order.status === 'shipped' ? 'active' : ''}`;
        shipBtn.textContent = 'Mark Shipped';
        shipBtn.disabled = !['confirmed', 'packed'].includes(order.status);
        shipBtn.addEventListener('click', () => updateStatus(order.id, 'shipped'));

        const delBtn = document.createElement('button');
        delBtn.className = `btn-status ${order.status === 'delivered' ? 'active' : ''}`;
        delBtn.textContent = 'Mark Delivered';
        delBtn.disabled = order.status !== 'shipped';
        delBtn.addEventListener('click', () => updateStatus(order.id, 'delivered'));

        controls.appendChild(shipBtn); controls.appendChild(delBtn);

        card.appendChild(details); card.appendChild(itemsList); card.appendChild(controls);

        if (!reduced) {
          card.style.opacity = '0';
          card.style.transform = 'translateY(14px)';
        }
        container.appendChild(card);
      });

      if (!reduced) {
        requestAnimationFrame(() => {
          Array.from(container.children).forEach((card, idx) => {
            card.style.transition = `opacity var(--duration-slow) var(--ease) ${idx * 50}ms, transform var(--duration-slow) var(--ease) ${idx * 50}ms`;
            card.style.opacity = '1';
            card.style.transform = 'none';
          });
        });
      }
    }

    function formatStatus(status) {
      const map = {
        confirmed: 'Confirmed',
        packed: 'Packed',
        shipped: 'Shipped',
        delivered: 'Delivered',
      };
      return map[status] || status || 'Unknown';
    }

    async function updateStatus(orderId, newStatus) {
      const card = document.querySelector(`.order-card[data-order-id="${CSS.escape(orderId)}"]`);
      card?.classList.add('status-updating');
      try {
        await api.patch(`/rider/orders/${orderId}/status`, { status: newStatus }, true);
        showToast('Status updated successfully', 'success');
        loadOrders();
      } catch (err) {
        console.error('Failed to update status:', err);
        showToast('Failed to update status', 'error');
        card?.classList.remove('status-updating');
      }
    }
  </script>
</body>
</html>
