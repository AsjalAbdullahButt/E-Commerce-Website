name: Frontend build

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-build.yml"
  workflow_dispatch: {}

jobs:
  build:
    name: npm run build (frontend/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Proves the Tailwind CLI compile (shared/css/tailwind.build.css) and the dist/ static
      # copy (scripts/build-dist.js) both still succeed — every page links tailwind.build.css,
      # so a silently broken build here means every page ships a missing/stale stylesheet.
      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Verify tailwind.build.css was produced
        working-directory: frontend
        run: test -f shared/css/tailwind.build.css
