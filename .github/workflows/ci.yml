name: Backend tests

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch: {}

jobs:
  pytest:
    name: pytest (backend/tests)
    runs-on: ubuntu-latest

    # tests/conftest.py builds its schema straight from Base.metadata (drop_all + create_all,
    # once per test session) rather than replaying Alembic migrations — see its own comment for
    # why a throwaway CI database doesn't need migration history. It does still need a real
    # MySQL server to run against (async SQLAlchemy + aiomysql, no sqlite fallback anywhere in
    # this codebase), hence the service container below instead of mocking the DB layer.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_test_password
          MYSQL_DATABASE: ecommerce_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run pytest
        working-directory: backend
        env:
          # Mirrors .env.example — none of these are real credentials, this database only ever
          # exists for the lifetime of this job.
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3306"
          MYSQL_USER: root
          MYSQL_PASSWORD: ci_test_password
          MYSQL_DATABASE: ecommerce_test
          MYSQL_TEST_DATABASE: ecommerce_test
          JWT_SECRET: ci_only_jwt_secret_this_is_not_a_real_secret_value
          ENVIRONMENT: development
          DOCS_ENABLED: "false"
        run: pytest
